{% extends "comun/base.html" %}
{% load static %}

{% comment %}
  Portada pública.

  Se retiró el <style> propio (~95 líneas): degradado salmón/naranja
  (#ff7aa0 → #ffd86f), burbujas animadas, cinco tonos pastel distintos
  para las seis tarjetas y títulos rosa (#ff6685) que quedaban en 2.6:1
  sobre su propio fondo, por debajo del mínimo AA para texto grande.

  Ahora las seis tarjetas comparten un único tratamiento y el granate
  institucional marca la jerarquía.

  Corrección de datos: las noticias mostraban n.fecha_publicacion, campo
  renombrado a creado_en por la migración 0003, así que la fecha nunca
  aparecía. Los estados vacíos explican qué falta en lugar de decir
  sólo "No hay".
{% endcomment %}

{% block title %}Campeonatos UIDE Loja{% endblock %}
{% block meta_description %}Calendarios, resultados y tablas de posiciones de los campeonatos deportivos internos de la UIDE Loja.{% endblock %}

{% block content %}

<section class="uide-hero">
  <div class="uide-hero__inner">
    <img class="uide-hero__logo" src="{% static 'img/logo.png' %}" alt="UIDE Loja">
    <h1>Campeonatos internos UIDE Loja</h1>
    <p class="uide-hero__lead">
      Calendarios, resultados y tablas de posiciones de las competencias entre carreras.
    </p>
    <div class="uide-hero__actions">
      <a class="button is-light" href="{% url 'campeonatos_publicos' %}">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-trofeo"></use></svg>
        <span>Ver campeonatos</span>
      </a>
      <a class="button is-outline" href="{% url 'resultados_publicos' %}">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-estadisticas"></use></svg>
        <span>Últimos resultados</span>
      </a>
    </div>
  </div>
</section>

<div class="container uide-container mt-6">
  <div class="uide-feed">

    {# --- Campeonatos activos --- #}
    <div class="uide-feed__card">
      <div class="uide-feed__head">
        <h2 class="uide-feed__title">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-trofeo"></use></svg>
          Campeonatos activos
        </h2>
        <a class="see-all" href="{% url 'campeonatos_publicos' %}">Ver todo</a>
      </div>
      <div class="uide-feed__body">
        <ul class="uide-feed__list">
          {% for campeonato in campeonatos %}
            <li>
              <p class="uide-feed__item-title">{{ campeonato.nombre }}</p>
              <p class="uide-feed__meta">
                {% if campeonato.deporte %}<span>{{ campeonato.deporte.nombre }}</span>{% endif %}
                <span class="uide-with-icon">
                  <svg class="uide-icon" aria-hidden="true"><use href="#i-calendario"></use></svg>
                  {{ campeonato.fecha_inicio|date:"d M Y" }} – {{ campeonato.fecha_fin|date:"d M Y" }}
                </span>
              </p>
              <p class="mt-2">
                <a class="button is-small is-light" href="{% url 'tabla_estadisticas' campeonato.id %}">
                  <svg class="uide-icon" aria-hidden="true"><use href="#i-estadisticas"></use></svg>
                  <span>Tabla de posiciones</span>
                </a>
              </p>
            </li>
          {% empty %}
            <li>
              <div class="uide-empty">
                <span class="uide-empty__icon">
                  <svg class="uide-icon uide-icon--lg" aria-hidden="true"><use href="#i-trofeo"></use></svg>
                </span>
                <p class="uide-empty__title">Sin campeonatos en curso</p>
                <p class="uide-empty__text">Cuando se abra una nueva convocatoria aparecerá aquí.</p>
              </div>
            </li>
          {% endfor %}
        </ul>
      </div>
    </div>

    {# --- Próximos partidos --- #}
    <div class="uide-feed__card">
      <div class="uide-feed__head">
        <h2 class="uide-feed__title">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-calendario"></use></svg>
          Próximos partidos
        </h2>
        <a class="see-all" href="{% url 'campeonatos_publicos' %}">Ver todo</a>
      </div>
      <div class="uide-feed__body">
        <ul class="uide-feed__list">
          {% for partido in proximos_partidos %}
            <li>
              <p class="uide-feed__item-title">
                {{ partido.equipo_local.nombre }} <span class="has-text-grey">vs</span> {{ partido.equipo_visitante.nombre }}
              </p>
              <p class="uide-feed__meta">
                <span class="uide-with-icon">
                  <svg class="uide-icon" aria-hidden="true"><use href="#i-calendario"></use></svg>
                  {{ partido.fecha|date:"d M" }}
                </span>
                <span class="uide-with-icon">
                  <svg class="uide-icon" aria-hidden="true"><use href="#i-reloj"></use></svg>
                  {{ partido.hora|time:"H:i" }}
                </span>
                {% if partido.lugar %}
                  <span class="uide-with-icon">
                    <svg class="uide-icon" aria-hidden="true"><use href="#i-lugar"></use></svg>
                    {{ partido.lugar }}
                  </span>
                {% endif %}
              </p>
            </li>
          {% empty %}
            <li>
              <div class="uide-empty">
                <span class="uide-empty__icon">
                  <svg class="uide-icon uide-icon--lg" aria-hidden="true"><use href="#i-calendario"></use></svg>
                </span>
                <p class="uide-empty__title">Sin partidos programados</p>
                <p class="uide-empty__text">
                  El calendario se publica cuando se genera el fixture del campeonato.
                </p>
              </div>
            </li>
          {% endfor %}
        </ul>
      </div>
    </div>

    {# --- Transmisiones --- #}
    <div class="uide-feed__card">
      <div class="uide-feed__head">
        <h2 class="uide-feed__title">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-transmision"></use></svg>
          Transmisiones
        </h2>
        <a class="see-all" href="{% url 'listar_transmisiones' %}">Ver todo</a>
      </div>
      <div class="uide-feed__body">
        <ul class="uide-feed__list">
          {% for t in transmisiones %}
            <li>
              <p class="uide-feed__item-title uide-clamp-1">
                {% if t.partido %}
                  {{ t.partido.equipo_local.nombre }} vs {{ t.partido.equipo_visitante.nombre }}
                {% else %}
                  Transmisión
                {% endif %}
              </p>
              {% if t.descripcion %}
                <p class="uide-feed__meta uide-clamp-1">{{ t.descripcion }}</p>
              {% endif %}
              {% if t.enlace %}
                <p class="mt-2">
                  <a class="button is-small is-light" href="{{ t.enlace }}" target="_blank" rel="noopener">
                    <svg class="uide-icon" aria-hidden="true"><use href="#i-transmision"></use></svg>
                    <span>Ver en vivo</span>
                  </a>
                </p>
              {% endif %}
            </li>
          {% empty %}
            <li>
              <div class="uide-empty">
                <span class="uide-empty__icon">
                  <svg class="uide-icon uide-icon--lg" aria-hidden="true"><use href="#i-transmision"></use></svg>
                </span>
                <p class="uide-empty__title">Nada en vivo ahora</p>
                <p class="uide-empty__text">Aquí verás los enlaces cuando haya partidos transmitidos.</p>
              </div>
            </li>
          {% endfor %}
        </ul>
      </div>
    </div>

    {# --- Galería --- #}
    <div class="uide-feed__card">
      <div class="uide-feed__head">
        <h2 class="uide-feed__title">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-imagen"></use></svg>
          Galería
        </h2>
        <a class="see-all" href="{% url 'listar_imagenes_galeria' %}">Ver todo</a>
      </div>
      <div class="uide-feed__body">
        {% if imagenes_galeria %}
          <div class="uide-thumbs">
            {% for imagen in imagenes_galeria %}
              <a href="{% url 'listar_imagenes_galeria' %}">
                {% if imagen.imagen %}
                  <img src="{{ imagen.imagen.url }}" loading="lazy"
                       alt="{{ imagen.titulo|default:'Imagen de la galería' }}">
                {% else %}
                  <img src="{% static 'img/logo.png' %}" loading="lazy" alt="">
                {% endif %}
              </a>
            {% endfor %}
          </div>
        {% else %}
          <div class="uide-empty">
            <span class="uide-empty__icon">
              <svg class="uide-icon uide-icon--lg" aria-hidden="true"><use href="#i-imagen"></use></svg>
            </span>
            <p class="uide-empty__title">Galería vacía</p>
            <p class="uide-empty__text">Las fotos de los partidos se publican al terminar cada jornada.</p>
          </div>
        {% endif %}
      </div>
    </div>

    {# --- Noticias --- #}
    <div class="uide-feed__card">
      <div class="uide-feed__head">
        <h2 class="uide-feed__title">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-noticia"></use></svg>
          Noticias
        </h2>
        <a class="see-all" href="{% url 'listar_noticias' %}">Ver todo</a>
      </div>
      <div class="uide-feed__body">
        <ul class="uide-feed__list">
          {% for n in noticias %}
            <li>
              <p class="uide-feed__item-title uide-clamp-2">{{ n.titulo }}</p>
              {% if n.contenido %}
                <p class="uide-feed__meta uide-clamp-2">{{ n.contenido|striptags|truncatechars:120 }}</p>
              {% endif %}
              {% if n.creado_en %}
                <p class="uide-feed__meta mt-1">
                  <span class="uide-with-icon">
                    <svg class="uide-icon" aria-hidden="true"><use href="#i-calendario"></use></svg>
                    {{ n.creado_en|date:"d M Y" }}
                  </span>
                </p>
              {% endif %}
            </li>
          {% empty %}
            <li>
              <div class="uide-empty">
                <span class="uide-empty__icon">
                  <svg class="uide-icon uide-icon--lg" aria-hidden="true"><use href="#i-noticia"></use></svg>
                </span>
                <p class="uide-empty__title">Sin noticias</p>
                <p class="uide-empty__text">Los anuncios de Bienestar Estudiantil aparecerán aquí.</p>
              </div>
            </li>
          {% endfor %}
        </ul>
      </div>
    </div>

    {# --- Testimonios --- #}
    <div class="uide-feed__card">
      <div class="uide-feed__head">
        <h2 class="uide-feed__title">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-testimonio"></use></svg>
          Testimonios
        </h2>
        <a class="see-all" href="{% url 'listar_testimonios' %}">Ver todo</a>
      </div>
      <div class="uide-feed__body">
        <ul class="uide-feed__list">
          {% for t in testimonios %}
            <li>
              <blockquote class="uide-quote">
                <p class="uide-clamp-2">{{ t.contenido }}</p>
                {% if t.autor %}<footer>{{ t.autor }}</footer>{% endif %}
              </blockquote>
            </li>
          {% empty %}
            <li>
              <div class="uide-empty">
                <span class="uide-empty__icon">
                  <svg class="uide-icon uide-icon--lg" aria-hidden="true"><use href="#i-testimonio"></use></svg>
                </span>
                <p class="uide-empty__title">Sin testimonios</p>
                <p class="uide-empty__text">Pronto compartiremos experiencias de jugadores y delegados.</p>
              </div>
            </li>
          {% endfor %}
        </ul>
      </div>
    </div>

  </div>

  {# --- Redes --- #}
  <h2 class="uide-section-title">Síguenos</h2>
  <div class="uide-toolbar">
    <a class="button is-light" href="https://instagram.com/uide" target="_blank" rel="noopener">
      <svg class="uide-icon" aria-hidden="true"><use href="#i-instagram"></use></svg>
      <span>Instagram</span>
    </a>
    <a class="button is-light" href="https://facebook.com/uide" target="_blank" rel="noopener">
      <svg class="uide-icon" aria-hidden="true"><use href="#i-facebook"></use></svg>
      <span>Facebook</span>
    </a>
    <a class="button is-light" href="https://youtube.com/uide" target="_blank" rel="noopener">
      <svg class="uide-icon" aria-hidden="true"><use href="#i-youtube"></use></svg>
      <span>YouTube</span>
    </a>
  </div>

</div>
{% endblock %}
