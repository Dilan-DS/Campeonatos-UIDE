{% extends 'comun/base.html' %}
{% load static %}
{% load widget_tweaks %}

{% comment %}
  Inicio de sesión.

  La versión anterior traía ~120 líneas de <style> con una tercera paleta
  (#6c2943 → #ff8da1 → #9ac6ff), burbujas animadas y tarjeta de cristal, y
  usaba iconos de Font Awesome que nunca se cargaban (campos con hueco a la
  izquierda y ojo invisible). Ahora usa el sistema de diseño y el sprite SVG.

  El toggle de contraseña pasó de un onclick en línea a un botón con
  aria-pressed que además cambia de icono.
{% endcomment %}

{% block title %}Iniciar sesión | Campeonatos UIDE{% endblock %}

{% block content %}
<section class="uide-auth">
  <div class="uide-auth__card">

    <div class="uide-auth__head">
      <img class="uide-auth__logo" src="{% static 'img/logo.png' %}" alt="UIDE Loja">
      <h1>Iniciar sesión</h1>
      <p>Accede con tu cuenta institucional para gestionar equipos, partidos y pagos.</p>
    </div>

    {% if form.non_field_errors %}
      <div class="uide-form-errors" role="alert">
        <strong class="uide-with-icon">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-error"></use></svg>
          No pudimos iniciar tu sesión
        </strong>
        <ul>
          {% for err in form.non_field_errors %}<li>{{ err }}</li>{% endfor %}
        </ul>
      </div>
    {% endif %}

    <form method="post" novalidate>
      {% csrf_token %}

      <div class="field">
        <label class="label" for="{{ form.username.id_for_label }}">
          {{ form.username.label }}
        </label>
        <div class="control">
          {{ form.username|add_class:"input"|attr:"autocomplete:username"|attr:"autofocus" }}
        </div>
        {% for error in form.username.errors %}
          <p class="help is-danger">
            <svg class="uide-icon" aria-hidden="true"><use href="#i-error"></use></svg>
            <span>{{ error }}</span>
          </p>
        {% endfor %}
      </div>

      <div class="field">
        <label class="label" for="{{ form.password.id_for_label }}">
          {{ form.password.label }}
        </label>
        <div class="control uide-password">
          {{ form.password|add_class:"input"|attr:"autocomplete:current-password" }}
          <button type="button" class="uide-password__toggle" data-toggle-password
                  aria-pressed="false" aria-label="Mostrar contraseña"
                  aria-controls="{{ form.password.id_for_label }}">
            <svg class="uide-icon" aria-hidden="true"><use href="#i-ver"></use></svg>
          </button>
        </div>
        {% for error in form.password.errors %}
          <p class="help is-danger">
            <svg class="uide-icon" aria-hidden="true"><use href="#i-error"></use></svg>
            <span>{{ error }}</span>
          </p>
        {% endfor %}
      </div>

      <div class="field mt-5">
        <button type="submit" class="button is-primary is-fullwidth">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-salir"></use></svg>
          <span>Entrar</span>
        </button>
      </div>
    </form>

    <div class="uide-auth__actions">
      <p>¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a></p>
      <p><a href="{% url 'password_reset' %}">Olvidé mi contraseña</a></p>
    </div>

  </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
  document.querySelectorAll('[data-toggle-password]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.getAttribute('aria-controls'));
      if (!input) return;
      const mostrar = input.type === 'password';
      input.type = mostrar ? 'text' : 'password';
      btn.setAttribute('aria-pressed', String(mostrar));
      btn.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
      btn.querySelector('use').setAttribute('href', mostrar ? '#i-prohibido' : '#i-ver');
    });
  });
</script>
{% endblock %}
