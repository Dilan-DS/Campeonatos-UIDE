{% extends 'comun/base.html' %}
{% block title %}Contraseña actualizada{% endblock %}

{% block content %}
<style>
  .auth-wrap{min-height:calc(100vh - 8rem);display:grid;place-items:center;background:linear-gradient(135deg,#f7f9fc,#eef3ff)}
  .auth-card{border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.08);overflow:hidden}
  .muted{color:#6b7280}
</style>

<section class="section auth-wrap">
  <div class="container">
    <div class="columns is-centered">
      <div class="column is-5-tablet is-4-desktop">
        <div class="card auth-card">
          <header class="card-header">
            <p class="card-header-title is-justify-content-center">¡Listo!</p>
          </header>
          <div class="card-content has-text-centered">
            <p>Tu contraseña fue actualizada correctamente.</p>
            <a class="button is-primary mt-4" href="{% url 'login' %}">Ir a iniciar sesión</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
