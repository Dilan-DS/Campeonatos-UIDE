{% extends 'comun/base.html' %}

{% comment %} Contraseña restablecida correctamente. {% endcomment %}

{% block title %}Contraseña actualizada | Campeonatos UIDE{% endblock %}

{% block content %}
<section class="uide-auth">
  <div class="uide-auth__card">

    <div class="uide-auth__head">
      <span class="uide-empty__icon">
        <svg class="uide-icon uide-icon--lg" aria-hidden="true"><use href="#i-exito"></use></svg>
      </span>
      <h1>Contraseña actualizada</h1>
      <p>Ya puedes entrar con tu nueva contraseña.</p>
    </div>

    <a class="button is-primary is-fullwidth" href="{% url 'login' %}">
      <svg class="uide-icon" aria-hidden="true"><use href="#i-salir"></use></svg>
      <span>Iniciar sesión</span>
    </a>

  </div>
</section>
{% endblock %}
