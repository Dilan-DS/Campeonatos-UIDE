{% extends 'comun/base.html' %}

{% block title %}Registrar partido | Campeonatos UIDE{% endblock %}

{% block content %}
<div class="container uide-container">

  <div class="uide-page-head">
    <div class="uide-page-head__text">
      <h1 class="title is-3">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-balon"></use></svg>
        Registrar partido
      </h1>
    </div>
    <div class="uide-page-head__actions">
      <a href="{% url 'listar_partidos' %}" class="button is-light">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-atras"></use></svg> Volver al listado
      </a>
    </div>
  </div>

  <div class="box">
    <form method="post" class="uide-form">
      {% csrf_token %}
      {% include "comun/_campos_formulario.html" with form=form %}

      <div class="uide-form-actions">
        <button type="submit" class="button is-primary">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-guardar"></use></svg>
          <span>Guardar partido</span>
        </button>
        <span class="uide-form-actions__spacer"></span>
        <a href="{% url 'listar_partidos' %}" class="button is-light">Cancelar</a>
      </div>
    </form>
  </div>

</div>
{% endblock %}
