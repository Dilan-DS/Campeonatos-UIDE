{% extends "comun/base.html" %}

{% comment %}
  Panel del jugador.

  Se retiró el <style> propio (~130 líneas) con un degradado ajeno a la
  marca. Se conservan el mismo contexto y la misma lógica por deporte:
  jugador, equipo, campeonato, upcoming_matches, player_stats,
  deporte_nombre, team_rank y team_points.

  Las tarjetas no disponibles dejaron de anunciarse como role="button".
  Las tablas usan estados vacíos con acción en lugar de un párrafo gris.
{% endcomment %}

{% block title %}Panel del jugador | Campeonatos UIDE{% endblock %}

{% block content %}
<div class="container uide-container">

  <div class="uide-page-head">
    <div class="uide-page-head__text">
      <h1 class="title is-3">Panel del jugador</h1>
      <p class="subtitle">Hola, <strong>{{ user.first_name|default:user.username }}</strong>.</p>
    </div>
    <div class="uide-page-head__actions">
      {% if equipo %}<span class="tag is-light">{{ equipo.nombre }}</span>{% endif %}
      {% if campeonato %}<span class="tag is-light">{{ campeonato.nombre }}</span>{% endif %}
      {% if team_rank %}<span class="tag is-success">Puesto {{ team_rank }}</span>{% endif %}
    </div>
  </div>

  {% if not equipo %}
    <div class="notification is-info">
      <svg class="uide-icon" aria-hidden="true"><use href="#i-info"></use></svg>
      <span>
        Todavía no estás asignado a un equipo. El delegado de tu carrera debe
        inscribirte para que puedas ver partidos y estadísticas.
      </span>
    </div>
  {% endif %}

  {# --- Accesos --- #}
  <div class="uide-nav-grid">
    {% if equipo %}
      <a class="uide-nav-card" href="{% url 'ver_equipo_jugador' equipo_id=equipo.id %}">
        <span class="uide-nav-card__icon">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-camiseta"></use></svg>
        </span>
        <span class="uide-nav-card__body">
          <span class="uide-nav-card__title">Mi equipo</span>
          <span class="uide-nav-card__text">Compañeros y datos del equipo</span>
        </span>
      </a>
    {% else %}
      <span class="uide-nav-card" aria-disabled="true">
        <span class="uide-nav-card__icon">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-camiseta"></use></svg>
        </span>
        <span class="uide-nav-card__body">
          <span class="uide-nav-card__title">Mi equipo</span>
          <span class="uide-nav-card__text">Sin equipo asignado</span>
        </span>
      </span>
    {% endif %}

    {% if campeonato %}
      <a class="uide-nav-card" href="{% url 'tabla_estadisticas' campeonato_id=campeonato.id %}">
        <span class="uide-nav-card__icon">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-estadisticas"></use></svg>
        </span>
        <span class="uide-nav-card__body">
          <span class="uide-nav-card__title">Tabla de posiciones</span>
          <span class="uide-nav-card__text">Cómo va {{ campeonato.nombre }}</span>
        </span>
      </a>
    {% else %}
      <span class="uide-nav-card" aria-disabled="true">
        <span class="uide-nav-card__icon">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-estadisticas"></use></svg>
        </span>
        <span class="uide-nav-card__body">
          <span class="uide-nav-card__title">Tabla de posiciones</span>
          <span class="uide-nav-card__text">Sin campeonato</span>
        </span>
      </span>
    {% endif %}

    {% if jugador %}
      <a class="uide-nav-card" href="{% url 'ver_estadisticas_jugador' jugador_id=jugador.id %}">
        <span class="uide-nav-card__icon">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-medalla"></use></svg>
        </span>
        <span class="uide-nav-card__body">
          <span class="uide-nav-card__title">Mis estadísticas</span>
          <span class="uide-nav-card__text">Tu rendimiento en detalle</span>
        </span>
      </a>
    {% endif %}

    <a class="uide-nav-card" href="{% url 'ver_mis_partidos' %}">
      <span class="uide-nav-card__icon">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-calendario"></use></svg>
      </span>
      <span class="uide-nav-card__body">
        <span class="uide-nav-card__title">Mis partidos</span>
        <span class="uide-nav-card__text">Todos tus encuentros</span>
      </span>
    </a>
  </div>

  {# --- Próximos partidos --- #}
  <h2 class="uide-section-title">Próximos partidos</h2>
  {% if upcoming_matches %}
    <div class="table-container">
      <table class="table is-fullwidth">
        <thead>
          <tr>
            <th scope="col">Fecha</th>
            <th scope="col">Hora</th>
            <th scope="col">Local</th>
            <th scope="col">Visitante</th>
            <th scope="col">Lugar</th>
          </tr>
        </thead>
        <tbody>
          {% for partido in upcoming_matches %}
            <tr>
              <td>{{ partido.fecha|date:"d/m/Y" }}</td>
              <td>{{ partido.hora|time:"H:i" }}</td>
              <td class="{% if partido.equipo_local == equipo %}uide-cell-strong{% endif %}">
                {{ partido.equipo_local.nombre }}
              </td>
              <td class="{% if partido.equipo_visitante == equipo %}uide-cell-strong{% endif %}">
                {{ partido.equipo_visitante.nombre }}
              </td>
              <td class="uide-cell-muted">{{ partido.lugar|default:"Por confirmar" }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  {% else %}
    <div class="uide-panel">
      <div class="uide-empty">
        <span class="uide-empty__icon">
          <svg class="uide-icon uide-icon--lg" aria-hidden="true"><use href="#i-calendario"></use></svg>
        </span>
        <p class="uide-empty__title">Sin partidos programados</p>
        <p class="uide-empty__text">
          {% if equipo %}
            Cuando se genere el fixture de tu campeonato verás aquí tus próximos encuentros.
          {% else %}
            Necesitas estar en un equipo para tener partidos asignados.
          {% endif %}
        </p>
        {% if campeonato %}
          <div class="uide-empty__actions">
            <a class="button is-light" href="{% url 'calendario_global' %}">
              <svg class="uide-icon" aria-hidden="true"><use href="#i-lista"></use></svg>
              <span>Ver calendario global</span>
            </a>
          </div>
        {% endif %}
      </div>
    </div>
  {% endif %}

  {# --- Estadísticas rápidas (columnas según el deporte) --- #}
  <h2 class="uide-section-title">
    Mis estadísticas{% if deporte_nombre %} · {{ deporte_nombre|title }}{% endif %}
  </h2>
  {% if player_stats %}
    <div class="table-container">
      <table class="table is-fullwidth">
        <thead>
          <tr>
            <th scope="col">Partidos jugados</th>
            {% if deporte_nombre == 'FUTBOL' %}
              <th scope="col">Goles</th><th scope="col">Amarillas</th><th scope="col">Rojas</th>
            {% elif deporte_nombre == 'BASQUET' %}
              <th scope="col">Canastas</th><th scope="col">Rebotes</th><th scope="col">Asistencias</th>
            {% elif deporte_nombre == 'AJEDREZ' %}
              <th scope="col">Ganadas</th><th scope="col">Empatadas</th><th scope="col">Perdidas</th>
            {% elif deporte_nombre == 'ECUABOLY' or deporte_nombre == 'TENIS' %}
              <th scope="col">Sets ganados</th><th scope="col">Sets perdidos</th>
            {% elif deporte_nombre == 'PING PONG' or deporte_nombre == 'FUTBOLIN' or deporte_nombre == 'VIDEOJUEGOS' %}
              <th scope="col">Ganados</th><th scope="col">Perdidos</th>
              {% if deporte_nombre == 'FUTBOLIN' %}<th scope="col">Goles</th>{% endif %}
            {% endif %}
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="uide-cell-strong">{{ player_stats.partidos_jugados }}</td>
            {% if deporte_nombre == 'FUTBOL' %}
              <td>{{ player_stats.goles }}</td>
              <td>{{ player_stats.tarjetas_amarillas }}</td>
              <td>{{ player_stats.tarjetas_rojas }}</td>
            {% elif deporte_nombre == 'BASQUET' %}
              <td>{{ player_stats.canastas }}</td>
              <td>{{ player_stats.rebotes }}</td>
              <td>{{ player_stats.asistencias }}</td>
            {% elif deporte_nombre == 'AJEDREZ' %}
              <td>{{ player_stats.partidas_ganadas }}</td>
              <td>{{ player_stats.partidas_empatadas }}</td>
              <td>{{ player_stats.partidas_perdidas }}</td>
            {% elif deporte_nombre == 'ECUABOLY' or deporte_nombre == 'TENIS' %}
              <td>{{ player_stats.sets_ganados }}</td>
              <td>{{ player_stats.sets_perdidos }}</td>
            {% elif deporte_nombre == 'PING PONG' or deporte_nombre == 'FUTBOLIN' or deporte_nombre == 'VIDEOJUEGOS' %}
              <td>{{ player_stats.partidos_ganados }}</td>
              <td>{{ player_stats.partidos_perdidos }}</td>
              {% if deporte_nombre == 'FUTBOLIN' %}<td>{{ player_stats.goles }}</td>{% endif %}
            {% endif %}
          </tr>
        </tbody>
      </table>
    </div>
  {% else %}
    <div class="uide-panel">
      <div class="uide-empty">
        <span class="uide-empty__icon">
          <svg class="uide-icon uide-icon--lg" aria-hidden="true"><use href="#i-estadisticas"></use></svg>
        </span>
        <p class="uide-empty__title">Todavía sin estadísticas</p>
        <p class="uide-empty__text">
          Tus números aparecerán aquí cuando el árbitro registre el acta de tu primer partido.
        </p>
      </div>
    </div>
  {% endif %}

</div>
{% endblock %}
