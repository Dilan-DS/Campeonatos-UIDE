{% extends 'comun/base.html' %}

{% comment %}
  Panel de administración.

  Cambios respecto a la versión anterior:
  · Se retiró el <style> propio (~115 líneas) con una paleta turquesa que no
    correspondía al granate institucional.
  · Se retiró la barra de filtros Género/Año/Deporte: los <select> no tenían
    atributo name, no estaban dentro de un <form> y "Limpiar"/"Aplicar" eran
    <a> sin href. Prometía filtrar y no hacía nada; además ofrecía deportes
    ("Voleibol", "Basket") que no coinciden con el catálogo real.
  · Se retiraron las barras de progreso con anchos fijos (65%, 48%, 72%):
    no representaban ningún dato.
  · Las 14 tarjetas planas se agrupan por área para que el panel se pueda
    recorrer de un vistazo.
  · Cada acceso es un enlace completo en lugar de una tarjeta con un botón
    dentro: un solo objetivo de clic y una sola parada de tabulación.
  · "Delegados" apuntaba a registrar_delegado; ahora abre el listado.
{% endcomment %}

{% block title %}Panel de administración | Campeonatos UIDE{% endblock %}

{% block content %}
<div class="container uide-container">

  <div class="uide-page-head">
    <div class="uide-page-head__text">
      <h1 class="title is-3">Panel de administración</h1>
      <p class="subtitle">
        Hola, <strong>{{ user.first_name|default:user.username }}</strong>. Desde aquí gestionas
        toda la competencia.
      </p>
    </div>
    <div class="uide-page-head__actions">
      {% if campeonato %}
        <span class="tag {% if campeonato.fixture_generado %}is-success{% else %}is-warning{% endif %}">
          {{ campeonato.nombre }} ·
          {% if campeonato.fixture_generado %}fixture generado{% else %}en inscripción{% endif %}
        </span>
      {% endif %}
    </div>
  </div>

  {# --- Métricas --- #}
  <div class="uide-stats">
    <div class="uide-stat">
      <span class="uide-stat__icon">
        <svg class="uide-icon uide-icon--lg" aria-hidden="true"><use href="#i-equipos"></use></svg>
      </span>
      <span class="uide-stat__body">
        <span class="uide-stat__value">{{ kpi_usuarios }}</span>
        <span class="uide-stat__label">Usuarios registrados</span>
      </span>
    </div>
    <div class="uide-stat">
      <span class="uide-stat__icon">
        <svg class="uide-icon uide-icon--lg" aria-hidden="true"><use href="#i-trofeo"></use></svg>
      </span>
      <span class="uide-stat__body">
        <span class="uide-stat__value">{{ kpi_campeonatos }}</span>
        <span class="uide-stat__label">Campeonatos activos</span>
      </span>
    </div>
    <div class="uide-stat">
      <span class="uide-stat__icon">
        <svg class="uide-icon uide-icon--lg" aria-hidden="true"><use href="#i-escudo"></use></svg>
      </span>
      <span class="uide-stat__body">
        <span class="uide-stat__value">{{ kpi_equipos }}</span>
        <span class="uide-stat__label">Equipos inscritos</span>
      </span>
    </div>
    <div class="uide-stat">
      <span class="uide-stat__icon">
        <svg class="uide-icon uide-icon--lg" aria-hidden="true"><use href="#i-arbitro"></use></svg>
      </span>
      <span class="uide-stat__body">
        <span class="uide-stat__value">{{ kpi_arbitros }}</span>
        <span class="uide-stat__label">Árbitros disponibles</span>
      </span>
    </div>
  </div>

  {% if kpi_pagos_pendientes %}
    <div class="notification is-warning">
      <svg class="uide-icon" aria-hidden="true"><use href="#i-alerta"></use></svg>
      <span>
        Hay <strong>{{ kpi_pagos_pendientes }}</strong> pago{{ kpi_pagos_pendientes|pluralize:"s" }}
        pendiente{{ kpi_pagos_pendientes|pluralize:"s" }} de revisión.
        <a href="{% url 'listar_pagos_admin' %}">Revisar pagos</a>
      </span>
    </div>
  {% endif %}

  {# --- Competencia --- #}
  <h2 class="uide-section-title">Competencia</h2>
  <div class="uide-nav-grid">
    <a class="uide-nav-card" href="{% url 'listar_campeonatos' %}">
      <span class="uide-nav-card__icon">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-trofeo"></use></svg>
      </span>
      <span class="uide-nav-card__body">
        <span class="uide-nav-card__title">Campeonatos</span>
        <span class="uide-nav-card__text">Crear, editar y generar fixtures</span>
      </span>
    </a>

    <a class="uide-nav-card" href="{% url 'listar_equipos' %}">
      <span class="uide-nav-card__icon">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-escudo"></use></svg>
      </span>
      <span class="uide-nav-card__body">
        <span class="uide-nav-card__title">Equipos</span>
        <span class="uide-nav-card__text">Equipos inscritos y sus jugadores</span>
      </span>
    </a>

    <a class="uide-nav-card" href="{% url 'calendario_global' %}">
      <span class="uide-nav-card__icon">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-calendario"></use></svg>
      </span>
      <span class="uide-nav-card__body">
        <span class="uide-nav-card__title">Partidos</span>
        <span class="uide-nav-card__text">Calendario global y resultados</span>
      </span>
    </a>

    {% if campeonato and campeonato.fixture_generado %}
      <a class="uide-nav-card" href="{% url 'calendario_campeonato' campeonato.id %}">
        <span class="uide-nav-card__icon">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-calendario"></use></svg>
        </span>
        <span class="uide-nav-card__body">
          <span class="uide-nav-card__title">Fixture actual</span>
          <span class="uide-nav-card__text">{{ campeonato.nombre }}</span>
        </span>
      </a>
    {% else %}
      <span class="uide-nav-card" aria-disabled="true">
        <span class="uide-nav-card__icon">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-calendario"></use></svg>
        </span>
        <span class="uide-nav-card__body">
          <span class="uide-nav-card__title">Fixture actual</span>
          <span class="uide-nav-card__text">Disponible al cerrar las inscripciones</span>
        </span>
      </span>
    {% endif %}

    <a class="uide-nav-card" href="{% url 'listar_suspensiones' %}">
      <span class="uide-nav-card__icon">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-prohibido"></use></svg>
      </span>
      <span class="uide-nav-card__body">
        <span class="uide-nav-card__title">Suspensiones</span>
        <span class="uide-nav-card__text">Sanciones vigentes e historial</span>
      </span>
    </a>

    <a class="uide-nav-card" href="{% url 'estadisticas_futbol' %}">
      <span class="uide-nav-card__icon">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-estadisticas"></use></svg>
      </span>
      <span class="uide-nav-card__body">
        <span class="uide-nav-card__title">Estadísticas</span>
        <span class="uide-nav-card__text">Resumen por deporte (fútbol)</span>
      </span>
    </a>
  </div>

  {# --- Personas --- #}
  <h2 class="uide-section-title">Personas</h2>
  <div class="uide-nav-grid">
    <a class="uide-nav-card" href="{% url 'listar_usuarios' %}">
      <span class="uide-nav-card__icon">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-equipos"></use></svg>
      </span>
      <span class="uide-nav-card__body">
        <span class="uide-nav-card__title">Usuarios</span>
        <span class="uide-nav-card__text">Cuentas y roles del sistema</span>
      </span>
    </a>

    <a class="uide-nav-card" href="{% url 'listar_delegados' %}">
      <span class="uide-nav-card__icon">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-usuario"></use></svg>
      </span>
      <span class="uide-nav-card__body">
        <span class="uide-nav-card__title">Delegados</span>
        <span class="uide-nav-card__text">Responsables por carrera</span>
      </span>
    </a>

    <a class="uide-nav-card" href="{% url 'listar_arbitros' %}">
      <span class="uide-nav-card__icon">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-arbitro"></use></svg>
      </span>
      <span class="uide-nav-card__body">
        <span class="uide-nav-card__title">Árbitros</span>
        <span class="uide-nav-card__text">Registro y asignación a partidos</span>
      </span>
    </a>

    <a class="uide-nav-card" href="{% url 'listar_jugadores_admin' %}">
      <span class="uide-nav-card__icon">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-camiseta"></use></svg>
      </span>
      <span class="uide-nav-card__body">
        <span class="uide-nav-card__title">Jugadores</span>
        <span class="uide-nav-card__text">Inscripción en equipos</span>
      </span>
    </a>
  </div>

  {# --- Pagos --- #}
  <h2 class="uide-section-title">Pagos</h2>
  <div class="uide-nav-grid">
    <a class="uide-nav-card" href="{% url 'listar_pagos_admin' %}">
      <span class="uide-nav-card__icon">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-pago"></use></svg>
      </span>
      <span class="uide-nav-card__body">
        <span class="uide-nav-card__title">Pagos de inscripción</span>
        <span class="uide-nav-card__text">Aprobar o rechazar comprobantes</span>
      </span>
    </a>

    <a class="uide-nav-card" href="{% url 'listar_codigos_qr' %}">
      <span class="uide-nav-card__icon">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-qr"></use></svg>
      </span>
      <span class="uide-nav-card__body">
        <span class="uide-nav-card__title">Códigos QR</span>
        <span class="uide-nav-card__text">Cuentas bancarias para transferencias</span>
      </span>
    </a>
  </div>

  {# --- Contenido público --- #}
  <h2 class="uide-section-title">Contenido público</h2>
  <div class="uide-nav-grid">
    <a class="uide-nav-card" href="{% url 'listar_noticias' %}">
      <span class="uide-nav-card__icon">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-noticia"></use></svg>
      </span>
      <span class="uide-nav-card__body">
        <span class="uide-nav-card__title">Noticias</span>
        <span class="uide-nav-card__text">Publicaciones de la portada</span>
      </span>
    </a>

    <a class="uide-nav-card" href="{% url 'listar_imagenes_galeria' %}">
      <span class="uide-nav-card__icon">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-imagen"></use></svg>
      </span>
      <span class="uide-nav-card__body">
        <span class="uide-nav-card__title">Galería</span>
        <span class="uide-nav-card__text">Imágenes de los campeonatos</span>
      </span>
    </a>

    <a class="uide-nav-card" href="{% url 'listar_testimonios' %}">
      <span class="uide-nav-card__icon">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-testimonio"></use></svg>
      </span>
      <span class="uide-nav-card__body">
        <span class="uide-nav-card__title">Testimonios</span>
        <span class="uide-nav-card__text">Comentarios de participantes</span>
      </span>
    </a>

    <a class="uide-nav-card" href="{% url 'listar_transmisiones' %}">
      <span class="uide-nav-card__icon">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-transmision"></use></svg>
      </span>
      <span class="uide-nav-card__body">
        <span class="uide-nav-card__title">Transmisiones</span>
        <span class="uide-nav-card__text">Enlaces en vivo por partido</span>
      </span>
    </a>
  </div>

  {# --- Catálogos --- #}
  <h2 class="uide-section-title">Catálogos</h2>
  <div class="uide-nav-grid">
    <a class="uide-nav-card" href="{% url 'listar_deportes' %}">
      <span class="uide-nav-card__icon">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-deporte"></use></svg>
      </span>
      <span class="uide-nav-card__body">
        <span class="uide-nav-card__title">Deportes</span>
        <span class="uide-nav-card__text">Disciplinas de la competencia</span>
      </span>
    </a>

    <a class="uide-nav-card" href="{% url 'listar_carreras' %}">
      <span class="uide-nav-card__icon">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-carrera"></use></svg>
      </span>
      <span class="uide-nav-card__body">
        <span class="uide-nav-card__title">Carreras</span>
        <span class="uide-nav-card__text">Programas académicos participantes</span>
      </span>
    </a>
  </div>

  {# --- Exportaciones --- #}
  <h2 class="uide-section-title">Exportar</h2>
  <div class="uide-toolbar">
    <a class="button is-light" href="{% url 'exportar_estadisticas_pdf' %}">
      <svg class="uide-icon" aria-hidden="true"><use href="#i-descargar"></use></svg>
      <span>Estadísticas en PDF</span>
    </a>
    <a class="button is-light" href="{% url 'exportar_estadisticas_excel' %}">
      <svg class="uide-icon" aria-hidden="true"><use href="#i-descargar"></use></svg>
      <span>Estadísticas en Excel</span>
    </a>
  </div>

</div>
{% endblock %}
