{% extends "comun/base.html" %}
{% load static %}

{% comment %}
  Panel del delegado.

  Se retiró el <style> propio (~100 líneas) con un degradado rosa/naranja
  (#ff7aa2 → #ffdf6b) ajeno al granate institucional.

  Se conserva intacta la lógica de estados: registrar equipo sólo si no
  hay equipo, jugadores sólo si el equipo está aprobado, calendario y
  tabla sólo si el equipo tiene campeonato. Las tarjetas no disponibles
  dejaron de anunciarse como role="button" (no son botones) y explican
  qué falta para habilitarlas.

  El bloque de estado pasa a ser el siguiente paso recomendado, arriba y
  con acción directa, en lugar de un párrafo suelto.
{% endcomment %}

{% block title %}Panel del delegado | Campeonatos UIDE{% endblock %}

{% block content %}
<div class="container uide-container">

  <div class="uide-page-head">
    <div class="uide-page-head__text">
      <h1 class="title is-3">Panel del delegado</h1>
      <p class="subtitle">
        Hola, <strong>{{ user.first_name|default:user.username }}</strong>.
        {% if equipo %}Administra tu equipo, jugadores y pagos.{% else %}Empieza inscribiendo tu equipo.{% endif %}
      </p>
    </div>
  </div>

  {# --- Estado del equipo --- #}
  {% if equipo %}
    <div class="uide-panel mb-5">
      <div class="uide-panel__head">
        <h2 class="uide-panel__title">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-escudo"></use></svg>
          {{ equipo.nombre }}
        </h2>
        <a class="button is-small is-light" href="{% url 'detalle_equipo' id=equipo.id %}">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-ver"></use></svg>
          <span>Ver equipo</span>
        </a>
      </div>
      <div class="uide-panel__body">
        <dl class="uide-details">
          <div>
            <dt>Campeonato</dt>
            <dd>{{ equipo.campeonato.nombre|default:"Sin campeonato asignado" }}</dd>
          </div>
          <div>
            <dt>Carrera</dt>
            <dd>{{ equipo.carrera.nombre|default:"—" }}</dd>
          </div>
          <div>
            <dt>Inscripción del equipo</dt>
            <dd>
              {% if equipo.aprobado %}
                <span class="uide-status has-text-success">Aprobado</span>
              {% else %}
                <span class="uide-status has-text-warning">Pendiente de aprobación</span>
              {% endif %}
            </dd>
          </div>
          <div>
            <dt>Pago de inscripción</dt>
            <dd>
              {% if pago.estado == 'APROBADO' %}
                <span class="uide-status has-text-success">Aprobado</span>
              {% elif pago.estado == 'RECHAZADO' %}
                <span class="uide-status has-text-danger">Rechazado</span>
              {% elif pago %}
                <span class="uide-status has-text-warning">En revisión</span>
              {% else %}
                <span class="uide-status has-text-warning">Sin registrar</span>
              {% endif %}
            </dd>
          </div>
        </dl>
      </div>
    </div>
  {% endif %}

  {# --- Siguiente paso --- #}
  {% if not equipo %}
    <div class="notification is-info">
      <svg class="uide-icon" aria-hidden="true"><use href="#i-info"></use></svg>
      <span>
        <strong>Empieza aquí:</strong> inscribe tu equipo para habilitar jugadores,
        calendario y pagos.
        <a href="{% url 'registrar_equipo' %}">Registrar equipo</a>
      </span>
    </div>
  {% elif not pago %}
    <div class="notification is-warning">
      <svg class="uide-icon" aria-hidden="true"><use href="#i-alerta"></use></svg>
      <span>
        <strong>Siguiente paso:</strong> registra el pago de inscripción de tu equipo.
        <a href="{% url 'registrar_pago_delegado' %}">Registrar pago</a>
      </span>
    </div>
  {% elif pago.estado == 'RECHAZADO' %}
    <div class="notification is-danger">
      <svg class="uide-icon" aria-hidden="true"><use href="#i-error"></use></svg>
      <span>
        <strong>Pago rechazado.</strong>
        {% if pago.observacion_admin %}{{ pago.observacion_admin }}{% endif %}
        <a href="{% url 'registrar_pago_delegado' %}">Corregir el pago</a>
      </span>
    </div>
  {% elif pago.estado != 'APROBADO' %}
    <div class="notification is-warning">
      <svg class="uide-icon" aria-hidden="true"><use href="#i-reloj"></use></svg>
      <span>
        Tu pago está <strong>en revisión</strong>. Cuando se apruebe podrás gestionar jugadores.
      </span>
    </div>
  {% elif not equipo.aprobado %}
    <div class="notification is-warning">
      <svg class="uide-icon" aria-hidden="true"><use href="#i-reloj"></use></svg>
      <span>
        Pago aprobado. Falta que administración apruebe la inscripción del equipo.
      </span>
    </div>
  {% else %}
    <div class="notification is-success">
      <svg class="uide-icon" aria-hidden="true"><use href="#i-exito"></use></svg>
      <span>Todo en orden. Ya puedes gestionar a tus jugadores.</span>
    </div>
  {% endif %}

  {# --- Acciones --- #}
  <h2 class="uide-section-title">Gestión de mi equipo</h2>
  <div class="uide-nav-grid">

    {% if not equipo %}
      <a class="uide-nav-card" href="{% url 'registrar_equipo' %}">
        <span class="uide-nav-card__icon">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-mas"></use></svg>
        </span>
        <span class="uide-nav-card__body">
          <span class="uide-nav-card__title">Registrar equipo</span>
          <span class="uide-nav-card__text">Inscribe tu equipo en un campeonato</span>
        </span>
      </a>
    {% else %}
      <a class="uide-nav-card" href="{% url 'detalle_equipo' id=equipo.id %}">
        <span class="uide-nav-card__icon">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-escudo"></use></svg>
        </span>
        <span class="uide-nav-card__body">
          <span class="uide-nav-card__title">Mi equipo</span>
          <span class="uide-nav-card__text">Datos y estado de la inscripción</span>
        </span>
      </a>
    {% endif %}

    {% if equipo and equipo.aprobado %}
      <a class="uide-nav-card" href="{% url 'jugadores_equipo' id=equipo.id %}">
        <span class="uide-nav-card__icon">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-equipos"></use></svg>
        </span>
        <span class="uide-nav-card__body">
          <span class="uide-nav-card__title">Mis jugadores</span>
          <span class="uide-nav-card__text">Añadir y quitar jugadores del equipo</span>
        </span>
      </a>
    {% else %}
      <span class="uide-nav-card" aria-disabled="true">
        <span class="uide-nav-card__icon">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-equipos"></use></svg>
        </span>
        <span class="uide-nav-card__body">
          <span class="uide-nav-card__title">Mis jugadores</span>
          <span class="uide-nav-card__text">
            {% if not equipo %}Requiere un equipo inscrito{% else %}Se habilita al aprobarse el equipo{% endif %}
          </span>
        </span>
      </span>
    {% endif %}

    {% if equipo %}
      <a class="uide-nav-card" href="{% url 'registrar_pago_delegado' %}">
        <span class="uide-nav-card__icon">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-pago"></use></svg>
        </span>
        <span class="uide-nav-card__body">
          <span class="uide-nav-card__title">Pago de inscripción</span>
          <span class="uide-nav-card__text">Registrar o corregir el comprobante</span>
        </span>
      </a>
    {% else %}
      <span class="uide-nav-card" aria-disabled="true">
        <span class="uide-nav-card__icon">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-pago"></use></svg>
        </span>
        <span class="uide-nav-card__body">
          <span class="uide-nav-card__title">Pago de inscripción</span>
          <span class="uide-nav-card__text">Requiere un equipo inscrito</span>
        </span>
      </span>
    {% endif %}

    <a class="uide-nav-card" href="{% url 'mis_pagos_delegado' %}">
      <span class="uide-nav-card__icon">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-documento"></use></svg>
      </span>
      <span class="uide-nav-card__body">
        <span class="uide-nav-card__title">Historial de pagos</span>
        <span class="uide-nav-card__text">Comprobantes enviados y su estado</span>
      </span>
    </a>

  </div>

  <h2 class="uide-section-title">Competencia</h2>
  <div class="uide-nav-grid">

    {% if equipo and equipo.campeonato %}
      <a class="uide-nav-card" href="{% url 'fixture_campeonato' id=equipo.campeonato.id %}">
        <span class="uide-nav-card__icon">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-calendario"></use></svg>
        </span>
        <span class="uide-nav-card__body">
          <span class="uide-nav-card__title">Calendario</span>
          <span class="uide-nav-card__text">Fixture de {{ equipo.campeonato.nombre }}</span>
        </span>
      </a>

      <a class="uide-nav-card" href="{% url 'tabla_posiciones' campeonato_id=equipo.campeonato.id %}">
        <span class="uide-nav-card__icon">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-estadisticas"></use></svg>
        </span>
        <span class="uide-nav-card__body">
          <span class="uide-nav-card__title">Tabla de posiciones</span>
          <span class="uide-nav-card__text">Clasificación del campeonato</span>
        </span>
      </a>
    {% else %}
      <span class="uide-nav-card" aria-disabled="true">
        <span class="uide-nav-card__icon">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-calendario"></use></svg>
        </span>
        <span class="uide-nav-card__body">
          <span class="uide-nav-card__title">Calendario</span>
          <span class="uide-nav-card__text">Requiere un equipo en un campeonato</span>
        </span>
      </span>

      <span class="uide-nav-card" aria-disabled="true">
        <span class="uide-nav-card__icon">
          <svg class="uide-icon" aria-hidden="true"><use href="#i-estadisticas"></use></svg>
        </span>
        <span class="uide-nav-card__body">
          <span class="uide-nav-card__title">Tabla de posiciones</span>
          <span class="uide-nav-card__text">Requiere un equipo en un campeonato</span>
        </span>
      </span>
    {% endif %}

    <a class="uide-nav-card" href="{% url 'calendario_global' %}">
      <span class="uide-nav-card__icon">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-lista"></use></svg>
      </span>
      <span class="uide-nav-card__body">
        <span class="uide-nav-card__title">Calendario global</span>
        <span class="uide-nav-card__text">Todos los partidos programados</span>
      </span>
    </a>

  </div>

</div>
{% endblock %}
