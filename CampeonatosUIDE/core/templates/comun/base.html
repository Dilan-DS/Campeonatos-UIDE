{% load static %}
<!-- Carga archivos estáticos (CSS, imágenes, JS) -->

<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Configuración general de la página -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sistema de Campeonatos Deportivos UIDE Loja" />
  <meta name="author" content="Tu equipo UIDE" />
  <meta name="theme-color" content="#d32f2f" />
  <title>{% block title %}Campeonatos UIDE{% endblock %}</title>
  <!-- Título dinámico, definido por cada plantilla hija -->

  <!-- Ícono del navegador -->
  <link rel="icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon" />
  <!-- Framework CSS Bulma -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <!-- Fuente Roboto desde Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'styles/uide.css' %}">
  {% block extra_css %}{% endblock %}
</head>

<body class="uide-app is-flex is-flex-direction-column">
<!-- Cuerpo con fondo blanco y texto negro -->

  <!--  NAVBAR INCLUIDO -->
  {% include "comun/navbar.html" %}

  <!--  Contenido dinámico -->
  <main class="uide-main">
    {% if messages %}
    <div class="container uide-alerts mb-5">
    {% for message in messages %}
    <div class="notification {% if message.tags %}is-{{ message.tags }}{% endif %}">
    {{ message }}
    </div>
    {% endfor %}
    </div>
    {% endif %}
    {% block content %}
    {% endblock %}
  </main>

  <!--  Footer común -->
  {% include "comun/footer.html" %}

  <!-- JS para el menú hamburguesa en dispositivos móviles -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('table.table, table.jugadores-tabla').forEach((table) => {
        const headers = Array.from(table.querySelectorAll('thead th'))
          .map((header) => header.textContent.trim().replace(/\s+/g, ' '));
        const rows = table.querySelectorAll('tbody > tr');
        if (!headers.length || !rows.length) return;

        table.classList.add('uide-responsive-table');
        if (headers.includes('Equipo') && headers.includes('Puntos') && headers.includes('PJ')) {
          table.classList.add('uide-positions-table');
        }
        rows.forEach((row) => {
          Array.from(row.children).forEach((cell, index) => {
            if (cell.tagName === 'TD' && headers[index]) cell.dataset.label = headers[index];
          });
        });
      });
    });
  </script>

</body>
</html>
