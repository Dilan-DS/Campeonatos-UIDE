{% load static %}
<!-- Carga archivos estáticos (CSS, imágenes, JS) -->

<!DOCTYPE html>
<html lang="es">
<head>
  <style>
  @media screen and (max-width: 1024px) {
    .navbar-menu {
      display: none;
    }
    .navbar-menu.is-active {
      display: block;
    }
  }
  </style>




  <!-- Configuración general de la página -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sistema de Campeonatos Deportivos UIDE Loja" />
  <meta name="author" content="Tu equipo UIDE" />
  <meta name="theme-color" content="#d32f2f" />
  <title>{% block title %}Campeonatos UIDE{% endblock %}</title>
  <!-- Título dinámico, definido por cada plantilla hija -->

  <!-- Ícono del navegador -->
  <link rel="icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon" />
  <!-- Framework CSS Bulma -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <!-- Fuente Roboto desde Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
</head>

<body class="has-background-white has-text-black" style="display: flex; flex-direction: column; min-height: 100vh;">
<!-- Cuerpo con fondo blanco y texto negro -->

  <!--  NAVBAR INCLUIDO -->
  {% include "comun/navbar.html" %}

  <!--  Contenido dinámico -->
  <main style="flex: 1;">
    {% if messages %}
    <div class="container mt-4">
    {% for message in messages %}
    <div class="notification {% if message.tags %}is-{{ message.tags }}{% endif %}">
    {{ message }}
    </div>
    {% endfor %}
    </div>
    {% endif %}
    {% block content %}
    {% endblock %}
  </main>

  <!--  Footer común -->
  {% include "comun/footer.html" %}

  <!-- JS para el menú hamburguesa en dispositivos móviles -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const $navbarBurgers = Array.prototype.slice.call(document.querySelectorAll('.navbar-burger'), 0);
      if ($navbarBurgers.length > 0) {
        $navbarBurgers.forEach(el => {
          el.addEventListener('click', () => {
            const target = el.dataset.target;
            const $target = document.getElementById(target);
            el.classList.toggle('is-active');
            $target.classList.toggle('is-active');
          });
        });
      }
    });
  </script>

</body>
</html>
