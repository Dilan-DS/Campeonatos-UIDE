{% load static %}
{% comment %}
  Pie de página — Campeonatos UIDE

  La versión anterior traía un <style> propio con degradado dorado que
  chocaba con uide.css: el copyright terminaba en #eef2f6 sobre #FFD700
  (contraste 1.25:1, texto invisible). Ahora los estilos viven en
  uide.css (.uide-footer) sobre superficie oscura, con 4.5:1 o más.
{% endcomment %}
<footer class="footer uide-footer">
  <div class="uide-footer__inner">
    <div class="uide-footer__brand">
      <img class="uide-navbar__logo" src="{% static 'img/logo.png' %}" alt="">
      <span>Campeonatos UIDE Loja</span>
    </div>

    <nav class="uide-footer__nav" aria-label="Enlaces del pie de página">
      <a class="uide-footer__link" href="{% url 'campeonatos_publicos' %}">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-trofeo"></use></svg>
        Campeonatos
      </a>
      <a class="uide-footer__link" href="{% url 'resultados_publicos' %}">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-estadisticas"></use></svg>
        Resultados
      </a>
      <a class="uide-footer__link" href="{% url 'equipo_publico' %}">
        <svg class="uide-icon" aria-hidden="true"><use href="#i-equipos"></use></svg>
        Conócenos
      </a>
    </nav>

    <p class="uide-footer__copy">
      © 2025 Universidad Internacional del Ecuador — UIDE Loja · Proyecto Campeonatos
    </p>
  </div>
</footer>
